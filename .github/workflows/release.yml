# Release
# Publishes the version a GitHub release names to npm with trusted publishing and provenance. It packs one
# tarball, tests that file in a clean consumer, and publishes the same file.
#
# Setup: on npmjs.com, add a trusted publisher for this repository with the workflow file release.yml and
# the environment npm. Then create a GitHub release whose tag is v<version from package.json>.
#
# Reference: https://docs.npmjs.com/trusted-publishers

name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag, version, and changelog
        run: |
          version="$(node -p "require('./package.json').version")"

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The release tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Check that npm supports trusted publishing
        run: |
          node -e "process.exit(require('semver').gte(process.argv[1], '11.5.1') ? 0 : 1)" "$(npm --version)" ||
            { echo "::error::Trusted publishing needs npm 11.5.1 or later; found $(npm --version)."; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Pack the release tarball
        id: pack
        run: echo "tarball=$(npm pack --ignore-scripts | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Test the tarball in a clean consumer
        run: npm run test:smoke
        env:
          CONFIGRA_TARBALL: ${{ steps.pack.outputs.tarball }}
      - name: Publish the tested tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --ignore-scripts
