# Clean Consumer Installs
# Installs each generated setup from the npm registry and runs its checks when a preset or dependency set
# changes, every week, and on demand.
#
# Reference: https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax

name: Consumer installs

on:
  pull_request:
    paths:
      - "src/components/**"
      - "src/generator/**"
      - "dev/dependency-sets/**"
      - "tests/consumer/**"
      - ".github/workflows/consumer.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Consumer installs (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        # The minimum supported Node.js ships the minimum supported npm, and latest ships the newest.
        node:
          - 24.15.0
          - latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:consumer
