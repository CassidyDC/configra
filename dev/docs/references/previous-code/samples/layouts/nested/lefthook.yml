{
  "glob_matcher": "doublestar",
  "pre-commit":
    {
      "parallel": false,
      "commands":
        {
          ".:eslint":
            {
              "glob": ["**/*.{js,mjs,cjs}"],
              "exclude":
                [
                  "**/node_modules/**",
                  "**/vendor/**",
                  "**/.git/**",
                  "**/dist/**",
                  "**/build/**",
                  "**/.phpstan-cache/**",
                  "packages/node/**",
                  "packages/php/**",
                  "packages/wordpress-plugin/**",
                  "packages/wordpress-site/**",
                  "packages/wordpress-theme/**",
                ],
              "run": "npx --no-install eslint {staged_files}",
            },
          ".:markdownlint":
            {
              "glob": ["**/*.md"],
              "exclude":
                [
                  "**/node_modules/**",
                  "**/vendor/**",
                  "**/.git/**",
