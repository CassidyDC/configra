# Managed by Configra. Put your changes in lefthook-project.yml, which overrides this file.
# Put personal overrides in lefthook-local.yml, which overrides both.
# Activate the hooks with `npx lefthook install`. See https://lefthook.dev/configuration/

glob_matcher: doublestar

extends:
  - lefthook-project.yml

pre-commit:
  parallel: true
  commands:
    prettier:
      glob:
        - "*.{js,mjs,cjs,ts,mts,cts,json,md,yml,yaml}"
        - "wp-content/plugins/example/**/*"
        - "wp-content/themes/example/**/*"
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.configra/**"
        - "**/.cache/**"
        - "**/*.min.js"
        - "**/*.min.css"
      run: npx --no -- prettier --check --ignore-unknown --no-error-on-unmatched-pattern {staged_files}
    markdownlint:
      glob:
        - "wp-content/plugins/example/**/*.md"
        - "wp-content/themes/example/**/*.md"
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.configra/**"
        - "**/.cache/**"
        - "**/*.min.js"
        - "**/*.min.css"
      run: npx --no -- markdownlint-cli2 {staged_files}
    eslint:
      glob:
        - "wp-content/plugins/example/**/*.{js,mjs,cjs}"
        - "wp-content/themes/example/**/*.{js,mjs,cjs}"
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.configra/**"
        - "**/.cache/**"
        - "**/*.min.js"
        - "**/*.min.css"
      run: npx --no -- eslint --cache --cache-location .cache/eslint/ --no-warn-ignored {staged_files}
    stylelint:
      glob:
        - "wp-content/plugins/example/**/*.css"
        - "wp-content/themes/example/**/*.css"
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.configra/**"
        - "**/.cache/**"
        - "**/*.min.js"
        - "**/*.min.css"
      run: npx --no -- stylelint --allow-empty-input {staged_files}
    php-lint:
      glob:
        - "wp-content/plugins/example/**/*.php"
        - "wp-content/themes/example/**/*.php"
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.configra/**"
        - "**/.cache/**"
        - "**/*.min.js"
        - "**/*.min.css"
      run: node .configra/scripts/php-lint.js {staged_files}
    phpcs:
      glob:
        - "wp-content/plugins/example/**/*.php"
        - "wp-content/themes/example/**/*.php"
      exclude:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/.configra/**"
        - "**/.cache/**"
        - "**/*.min.js"
        - "**/*.min.css"
      run: node .configra/scripts/php-tool.js phpcs {staged_files}

pre-push:
  commands:
    phpstan:
      run: node .configra/scripts/php-tool.js phpstan analyse --memory-limit=1G --no-progress

commit-msg:
  commands:
    commit-message:
      run: node .configra/scripts/commit-msg.js --mode plain {1}
